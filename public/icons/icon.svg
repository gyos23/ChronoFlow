<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- App Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#334155" stroke-width="3" opacity="0.4"/>
  
  <!-- Outer Energy Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#1e293b" stroke-width="12"/>
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#waveGrad)" stroke-width="12" stroke-dasharray="800" stroke-dashoffset="240" stroke-linecap="round" filter="url(#glow)"/>
  
  <!-- Ultradian Sine Waveform Symbol -->
  <path d="M 120 280 C 170 160, 210 160, 256 256 C 302 352, 342 352, 392 232" fill="none" stroke="url(#waveGrad)" stroke-width="24" stroke-linecap="round" filter="url(#glow)"/>
  
  <!-- Golden Peak Node -->
  <circle cx="188" cy="188" r="16" fill="#f59e0b" filter="url(#glow)"/>
  
  <!-- Central Pulse Dot -->
  <circle cx="256" cy="256" r="10" fill="#ffffff" filter="url(#glow)"/>
  
  <!-- Rebound Node -->
  <circle cx="370" cy="275" r="14" fill="#6366f1" filter="url(#glow)"/>
</svg>
